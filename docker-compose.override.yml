services:
  ipreport.webapi:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Server=mysql;Port=3306;Database=ipreport;User=ipreport_app;Password=${MYSQL_PASSWORD}
    ports:
      - "8080"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
  
  ipreport.angular.app:
    build:
      target: development
    environment:
      - CHOKIDAR_USEPOLLING=true
    ports:
      - "4200:4200"
    volumes:
      - ./ipreport-angular-app:/app
      - /app/node_modules
